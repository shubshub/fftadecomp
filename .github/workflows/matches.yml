name: matches

# The repo rule: only byte-exact matches go in src/.
#
# Both checks are self-contained (no toolchain, no sibling checkout) because
# CI has no ROM: the disassembly and the raw runs are Square's data and are
# gitignored, so a workflow cannot recompile anything.  Recompiling is what
# verifies a match for real, and that stays local:
#
#     make verify          # status.py --write --verify
#     make match ADDR=0x08017514
#
# What CI can do without the ROM is check the evidence: every function in src/
# must carry a committed report that says byte-identical, and the README's
# numbers must match docs/status.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: every src/*.c must have a MATCH report
        run: |
          set -e
          status=0
          count=0
          # src/ is grouped into subsystem folders, so this has to recurse.
          # A flat 'src/*.c' glob silently skipped the 14 functions that live
          # in folders, and a PR could add a function there with no report
          # and still pass.
          while IFS= read -r f; do
            [ -e "$f" ] || continue
            addr=$(basename "$f" .c)
            count=$((count + 1))
            report="docs/match/${addr}.md"
            if [ ! -f "$report" ]; then
              echo "::error::${addr} has no match report (docs/match/${addr}.md)"
              status=1
            elif grep -q "IMPLAUSIBLE" "$report"; then
              echo "::error::${addr} reports IMPLAUSIBLE - byte-identical output from"
              echo "::error::implausible source is not a match; move it to Parked/"
              status=1
            elif ! grep -q "MATCH - byte identical" "$report"; then
              echo "::error::${addr} is committed but its report does not say MATCH"
              status=1
            elif ! grep -q "source plausibility: plausible" "$report"; then
              echo "::error::${addr} has no plausibility verdict in its report"
              status=1
            fi
          done < <(find src -name '*.c' -type f | sort)
          echo "checked $count function(s) in src/"
          exit $status

      - name: README status block matches docs/status.md
        run: |
          set -e
          sed -n '/<!-- ffta-status:start -->/,/<!-- ffta-status:end -->/p' \
            README.md > /tmp/readme_block.md
          if ! diff -u docs/status.md /tmp/readme_block.md; then
            echo "::error::the README status block is stale - run 'make status'"
            exit 1
          fi
          echo "README status block is current"

      - name: a Parked entry must not also be in src
        run: |
          set -e
          if [ -d Parked ] && [ -n "$(ls -A Parked 2>/dev/null | grep -v '^README.md$')" ]; then
            echo "::warning::Parked/ holds work that does not match yet:"
            ls -A Parked | grep -v '^README.md$' | sed 's/^/  /'
          fi
          echo "checked Parked/"