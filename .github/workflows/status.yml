name: status

# Keeps the README's progress numbers honest.
#
#   every push / PR  -> fail if the committed block is stale
#   weekly or manual -> recompute the block and publish the shields badges
#
# The "check" job is self-contained: it diffs the README block against
# docs/status.md.  The "refresh" job needs fftadecomp-kit, which is private, so
# it needs a fine-grained PAT in the repository secrets as KIT_TOKEN
# (contents: read on fftadecomp-kit).  Without it, refresh the numbers locally
# with `make status` and push - check still runs.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: status is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README status block matches docs/status.md
        run: |
          set -e
          sed -n '/<!-- ffta-status:start -->/,/<!-- ffta-status:end -->/p' \
            README.md > /tmp/readme_block.md
          diff -u docs/status.md /tmp/readme_block.md
          echo "status block is current"

  refresh:
    name: refresh status and badges
    needs: check
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && secrets.KIT_TOKEN != ''
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shubshub/fftadecomp-kit
          path: kit
          token: ${{ secrets.KIT_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: recompute the README block
        run: python kit/tools/status.py --write

      - name: compute badge endpoints
        run: python kit/tools/status.py --badges badges

      - name: commit the README block
        run: |
          if git diff --quiet -- README.md docs/status.md; then
            echo "README unchanged"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "docs: refresh decompilation status"
            git push -q origin HEAD:main
          fi

      # The README renders these with img.shields.io/endpoint?url=..., which
      # fetches the raw file from the badges branch (the pattern dqix-decomp
      # uses).  shields.io cannot read a private repository, so the badges
      # only render once this repo is public.
      - name: publish badges to the badges branch
        run: |
          git init -q -b badges publish
          cd publish
          git remote add origin "https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin badges 2>/dev/null; then
            git reset -q --hard FETCH_HEAD
          else
            git rm -rq --cached . 2>/dev/null || true
          fi
          rm -rf ./* 2>/dev/null || true
          cp ../badges/. .
          git add -A
          if git diff --cached --quiet; then
            echo "badges unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Update decompilation badges for ${{ github.sha }}"
          git push -q origin badges