name: status

# Keeps the README's progress numbers honest and publishes the badges.
#
#   every PR   -> fail if the committed block is stale
#   every push -> check the block, then republish the badges
#   weekly     -> backstop, in case a push-triggered run is missed
#   manual     -> republish on demand: `gh workflow run status.yml`, or a
#                 repository_dispatch with event_type "badges"
#
# The badge endpoints must refresh on every push to main: the weekly cron alone
# is not enough, because GitHub disables scheduled workflows after ~60 days of
# repository inactivity, and then the README badges silently freeze at whatever
# they showed when the last run happened.  Every push to main already touches
# the status block, so it is also the natural moment to republish.
#
# The "check" job is self-contained: it diffs the README block against
# docs/status.md.  The "refresh" job checks out fftadecomp-kit, which is
# public, so the default token is enough.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  repository_dispatch:
    types: [badges]

permissions:
  contents: write

jobs:
  check:
    name: status is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README status block matches docs/status.md
        run: |
          set -e
          sed -n '/<!-- ffta-status:start -->/,/<!-- ffta-status:end -->/p' \
            README.md > /tmp/readme_block.md
          diff -u docs/status.md /tmp/readme_block.md
          echo "status block is current"

  refresh:
    name: refresh status and badges
    needs: check
    # Runs on every push to main, not just on the weekly cron: the cron is a
    # backstop, because GitHub turns scheduled workflows off after ~60 days of
    # repository inactivity and the badges would then never refresh again.
    # pull_request is excluded on purpose - a fork PR must not publish.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch'
    # Two refreshes running at once would race on the badges branch push, so
    # serialise them; cancel-in-progress is off so a run is never killed
    # halfway through publishing.
    concurrency:
      group: status-badges
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      FFTA_BADGE_BASE: https://raw.githubusercontent.com/shubshub/fftadecomp/badges
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shubshub/fftadecomp-kit
          path: kit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The README block is NOT rewritten here.  status.py can only count a
      # function as matched when it has re-verified the report against the
      # current source, and that needs agbcc plus the (gitignored) base ROM,
      # neither of which exists on a hosted runner.  Without --verify it counts
      # nothing and would publish a 0.00% board.  The block is verified and
      # committed locally with `make status`.
      - name: refresh badge endpoints from the committed block
        run: |
          mkdir -p docs/badges
          python - <<'PY'
          import json, re, pathlib
          block = pathlib.Path("docs/status.md").read_text(encoding="utf-8")
          pct = {}
          for name in ("functions", "bytes"):
              m = re.search(rf"\| {name.capitalize()} matched \|[^|]*\|\s*\*\*([\d.]+)%\*\*", block)
              if m:
                  pct[name] = float(m.group(1))
          if len(pct) != 2:
              raise SystemExit(f"could not read the percentages from docs/status.md: {pct}")
          for name, value in pct.items():
              colour = "brightgreen" if value >= 100 else "yellowgreen" if value >= 80 \
                  else "yellow" if value >= 60 else "orange" if value >= 40 else "red"
              doc = {"schemaVersion": 1, "label": name,
                     "message": f"{value:.2f}%", "color": colour}
              pathlib.Path(f"docs/badges/{name}.json").write_text(
                  json.dumps(doc) + "\n", encoding="utf-8")
              print(f"{name:<10} {value:6.2f}%  {colour}")
          PY

      - name: commit the README block
        run: |
          if git diff --quiet -- README.md docs/status.md; then
            echo "README unchanged"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "docs: refresh decompilation status"
            git push -q origin HEAD:main
          fi

      # The README renders these with img.shields.io/endpoint?url=..., so
      # shields.io reads the JSON on the badges branch and the badges update
      # without anyone touching the README.  This needs the repo to be public -
      # while it is private, pass --static-badges and refresh them locally.
      - name: publish badges to the badges branch
        run: |
          git init -q -b badges publish
          cd publish
          git remote add origin "https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin badges 2>/dev/null; then
            git reset -q --hard FETCH_HEAD
          else
            git rm -rq --cached . 2>/dev/null || true
          fi
          rm -rf ./* 2>/dev/null || true
          cp -r ../docs/badges/. .
          git add -A
          if git diff --cached --quiet; then
            echo "badges unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Update decompilation badges for ${{ github.sha }}"
          git push -q origin badges