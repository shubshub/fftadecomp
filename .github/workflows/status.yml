name: status

# Keeps the README's progress block and the shields.io badges honest.
#   - every push / PR  -> fail if the committed numbers are stale
#   - weekly (or manual) -> recompute, rewrite the block, publish the badges

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: status is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shubshub/fftadecomp-kit
          path: kit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check the committed status block
        run: python kit/tools/status.py --check

  refresh:
    name: refresh status and badges
    needs: check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: shubshub/fftadecomp-kit
          path: kit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: recompute the README block
        run: python kit/tools/status.py --write

      - name: compute badge endpoints
        run: python kit/tools/status.py --badges badges

      - name: commit the README block
        run: |
          if git diff --quiet -- README.md; then
            echo "README unchanged"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "docs: refresh decompilation status"
            git push -q origin HEAD:main
          fi

      # the README renders these with img.shields.io/endpoint?url=..., which
      # fetches the raw file from the badges branch (same pattern dqix-decomp
      # uses).  Note: shields.io cannot read a private repository, so the
      # badges only render once the repo is public.
      - name: publish badges to the badges branch
        run: |
          git init -q -b badges publish
          cd publish
          git remote add origin "https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git"
          if git fetch -q --depth=1 origin badges 2>/dev/null; then
            git reset -q --hard FETCH_HEAD
          else
            git rm -rq --cached . 2>/dev/null || true
          fi
          rm -rf ./* 2>/dev/null || true
          cp ../badges/. .
          git add -A
          if git diff --cached --quiet; then
            echo "badges unchanged"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "Update decompilation badges for ${{ github.sha }}"
          git push -q origin badges